syntax = "proto3";

service ChatService {
    rpc CreatePersonalChat(CreatePersonalChatRequest) returns (ChatIdResponse);
    rpc CreateGroupChat(CreateGroupChatRequest) returns (ChatIdResponse);
    rpc AddGroupMember(AddGroupMemberRequest) returns (AddGroupMemberResponse);
    rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
    rpc SendMessage(SendMessageRequest) returns (Message);
    rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
    rpc Subscribe(SubscribeRequest) returns (stream Message);
}

message CreatePersonalChatRequest {
    string user_uuid = 1;
    string other_user_uuid = 2;
}

message CreateGroupChatRequest {
    string creator_uuid = 1;
    string name = 2;
    repeated string member_uuids = 3;
}

message ChatIdResponse {
    string chat_uuid = 1;
}

message AddGroupMemberRequest {
    string chat_uuid = 1;
    string creator_uuid = 2;
    string member_uuid = 3;
}

message AddGroupMemberResponse {
    bool added = 1;
}

message ListMembersRequest {
    string chat_uuid = 1;
    string user_uuid = 2;
}

message ChatMember {
    string user_uuid = 1;
    string login = 2;
    string name = 3;
}

message ListMembersResponse {
    repeated ChatMember members = 1;
}

message SendMessageRequest {
    string chat_uuid = 1;
    string sender_uuid = 2;
    string text = 3;
}

message Message {
    uint64 id = 1;
    string uuid = 2;
    string chat_uuid = 3;
    string sender_uuid = 4;
    string text = 5;
    string created_at = 6;
}

message ListMessagesRequest {
    string chat_uuid = 1;
    string user_uuid = 2;
    uint64 before_id = 3;
    uint32 limit = 4;
}

message ListMessagesResponse {
    repeated Message messages = 1;
}

message SubscribeRequest {
    string chat_uuid = 1;
    string user_uuid = 2;
    uint64 after_message_id = 3;
}
